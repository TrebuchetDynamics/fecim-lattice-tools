    <text x="0" y="114" font-size="48" font-weight="560" fill="#F4F1E8" letter-spacing="-1">Lattice Tools</text>
    <text x="2" y="165" font-size="22" fill="#C6CEC9">From cited assumptions to reproducible</text>
    <text x="2" y="195" font-size="22" fill="#C6CEC9">pre-silicon trade-offs.</text>

    <g transform="translate(2 245)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
