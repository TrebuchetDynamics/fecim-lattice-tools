<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FeCIM Lattice Tools</title>
  <desc id="desc">A simulation-only research workbench, illustrated with a reproducible eight-point HZO model sweep. Values are estimates, not measurements.</desc>

  <rect width="1200" height="420" rx="20" fill="#111815"/>
  <path d="M0 54H1200M724 54V420" stroke="#31403A" stroke-width="1"/>

