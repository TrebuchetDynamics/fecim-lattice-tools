name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:        # manual trigger for testing

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FECIM_CI_GATE: nightly
      FECIM_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build & vet
        run: go build ./... && go vet ./...

      - name: Future gogpu UI shell tests
        run: make test-next-ui

      - name: Full test suite (no -short)
        run: go test -count=1 ./...

      - name: Architecture check
        run: make arch-check

      - name: P-E reference regression (RG-PHY-OBS-01)
        env:
          FECIM_LITERATURE_JSON_DIR: ${{ github.workspace }}/output/validation/literature
        run: |
          mkdir -p output/validation/literature
          go test -v -count=1 ./validation/literature/... -run TestModule1_PELoop_ReferenceRegression

      - name: Full literature validation suite
        env:
          FECIM_LITERATURE_JSON_DIR: ${{ github.workspace }}/output/validation/literature
        run: |
          mkdir -p output/validation/literature
          go test -v -count=1 ./validation/literature/...

      - name: Monte Carlo uncertainty (RG-VAL-M1-04)
        env:
          FECIM_LITERATURE_JSON_DIR: ${{ github.workspace }}/output/montecarlo
        run: |
          mkdir -p output/montecarlo
          go test -v -count=1 ./validation/... -run TestM1_MonteCarlo_Uncertainty

      - name: Write-verify stats regression (RG-VAL-M1-03)
        env:
          FECIM_LITERATURE_JSON_DIR: ${{ github.workspace }}/output/write_stats
        run: |
          mkdir -p output/write_stats
          go test -v -count=1 ./validation/... -run TestM1_WriteVerifyStats_Regression

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-validation-${{ github.run_id }}
          path: |
            output/validation/
            output/montecarlo/
            output/write_stats/
          if-no-files-found: warn

  physics-race:
    name: Full physics race detection
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DISPLAY: ''
      WAYLAND_DISPLAY: ''
      FECIM_CI_GATE: nightly
      FECIM_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run broad physics race suite without short-mode exclusions
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          mkdir -p artifacts/physics-race
          go test -race -count=1 -timeout=60m ./shared/physics/... ./module1-hysteresis/... ./shared/crossbar/... 2>&1 | tee artifacts/physics-race/go-test.log

      - name: Upload physics race log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-race-${{ github.run_id }}
          path: artifacts/physics-race/
          if-no-files-found: warn
