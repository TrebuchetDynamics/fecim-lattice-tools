name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Playwright 1.60.0 supports this host, not ubuntu-latest's Ubuntu 26.04.
    runs-on: ubuntu-24.04
    # Serial hosted/local, parity, race and coverage gates exceed the old 20m cap.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard the locked browser host
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_ci_browser_host.py' -v

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup pinned Go for browser assets
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Pin frontend package manager
        run: npm install --global npm@11.17.0

      - name: Test and build web app
        run: npm ci && npm run generate:api && npm test && npm run build
        working-directory: web

      - name: Reject generated API drift
        run: git diff --exit-code -- workbench/moduleapi/openapi.json web/src/api/generated.ts

      - name: Typecheck and build both shared React profiles
        run: npm run typecheck && npm run build:hosted && npm run build:local
        working-directory: web

      - name: Install locked browser engines
        run: npx playwright install --with-deps chromium firefox
        working-directory: web

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Hosted React workflows, isolation and route budgets
        run: npm run test:e2e
        working-directory: web
        env:
          FECIM_WEB_SUITE: shared

      - name: Embedded authenticated local session and file workflows
        run: npm run test:e2e -- test/e2e/hysteresis-local.spec.ts
        working-directory: web

      - name: Local shared routes and real rooted research service
        run: npm run test:e2e
        working-directory: web
        env:
          FECIM_WEB_PROFILE: local
          FECIM_WEB_SUITE: shared

      - name: Shared research transport and root-lifetime races
        run: go test -race ./workbench/server ./workbench/moduleapi ./workbench/project ./workbench/study -count=1
        env:
          CGO_ENABLED: '1'

      - name: Exact native Node Firefox scientific parity and Worker budgets
        run: go test ./validation/wasm -count=1 -v
        env:
          FECIM_WASM_PARITY: '1'
          CGO_ENABLED: '1'

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: react-browser-failures
          path: web/test-results
          if-no-files-found: ignore

      - name: Run make ci
        run: make ci

      - name: Future gogpu UI shell tests
        run: make test-next-ui

      - name: Architecture check
        run: make arch-check

      - name: Verify fecim-skills are in sync
        run: scripts/install-fecim-skills.sh --check

      - name: Test fecim-skills install script
        run: scripts/test-install-fecim-skills.sh

      - name: P-E reference regression (RG-PHY-OBS-01, PR lane)
        env:
          FECIM_CI_GATE: pr
          FECIM_GIT_COMMIT: ${{ github.sha }}
          FECIM_LITERATURE_JSON_DIR: ${{ github.workspace }}/output/validation/literature
        run: |
          mkdir -p output/validation/literature
          go test -v -count=1 ./validation/literature/... -run TestModule1_PELoop_ReferenceRegression

      - name: Race detection (core packages)
        run: go test -race -short ./shared/... ./validation/...

      - name: Generate coverage report
        run: go test -short ./... -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

  external-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GUI and external validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev iverilog
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Record Icarus Verilog version
        run: iverilog -V

      - name: Run required external Verilog validation
        run: go test -v -count=1 ./validation/external/eda -run TestVerilogSanityCheck

      - name: Detect optional ngspice
        id: tools
        shell: bash
        run: |
          if command -v ngspice >/dev/null 2>&1; then
            echo "has_ngspice=true" >> "$GITHUB_OUTPUT"
            echo "ngspice detected"
          else
            echo "has_ngspice=false" >> "$GITHUB_OUTPUT"
            echo "ngspice missing; optional ngspice validation tests will be skipped"
          fi

      - name: Run optional ngspice external validation tests
        if: steps.tools.outputs.has_ngspice == 'true'
        run: go test -v ./validation/external/circuit -run '^TestNgspiceCrossbar_'

      - name: Summary for skipped optional ngspice checks
        if: steps.tools.outputs.has_ngspice != 'true'
        run: |
          echo "Optional ngspice validation checks were skipped because ngspice is unavailable."
          echo "Only the ngspice checks are non-fatal by policy."
