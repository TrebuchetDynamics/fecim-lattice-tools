name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run make ci
        run: make ci

      - name: Future gogpu UI shell tests
        run: make test-next-ui

      - name: Architecture check
        run: make arch-check

      - name: Verify fecim-skills are in sync
        run: scripts/install-fecim-skills.sh --check

      - name: Test fecim-skills install script
        run: scripts/test-install-fecim-skills.sh

      - name: Literature P-E loop validation (RG-PHY-OBS-01, PR lane)
        env:
          FECIM_CI_GATE: pr
          FECIM_GIT_COMMIT: ${{ github.sha }}
          FECIM_LITERATURE_JSON_DIR: ${{ github.workspace }}/output/validation/literature
        run: |
          mkdir -p output/validation/literature
          go test -v -count=1 ./validation/literature/... -run TestModule1_PELoop_LiteratureBacked

      - name: Race detection (core packages)
        run: go test -race -short ./shared/... ./validation/...

      - name: Generate coverage report
        run: go test -short ./... -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

  external-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GUI and external validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev iverilog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Record Icarus Verilog version
        run: iverilog -V

      - name: Run required external Verilog validation
        run: go test -v -count=1 ./validation/external/eda -run TestVerilogSanityCheck

      - name: Detect optional ngspice
        id: tools
        shell: bash
        run: |
          if command -v ngspice >/dev/null 2>&1; then
            echo "has_ngspice=true" >> "$GITHUB_OUTPUT"
            echo "ngspice detected"
          else
            echo "has_ngspice=false" >> "$GITHUB_OUTPUT"
            echo "ngspice missing; optional ngspice validation tests will be skipped"
          fi

      - name: Run optional ngspice external validation tests
        if: steps.tools.outputs.has_ngspice == 'true'
        run: go test -v ./validation/external/circuit -run '^TestNgspiceCrossbar_'

      - name: Summary for skipped optional ngspice checks
        if: steps.tools.outputs.has_ngspice != 'true'
        run: |
          echo "Optional ngspice validation checks were skipped because ngspice is unavailable."
          echo "Only the ngspice checks are non-fatal by policy."
